<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://bxngqqsxthybjikmwvqj.supabase.co wss://bxngqqsxthybjikmwvqj.supabase.co https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com https://*.mapbox.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="description" content="LineUp helps University of Arizona students know before they go out.">
<meta name="format-detection" content="telephone=no,address=no,email=no">
<meta name="application-name" content="LineUp">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LineUp">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LineUp">
<meta property="og:title" content="LineUp">
<meta property="og:description" content="Know Before You Go.">
<meta property="og:url" content="https://get-lineup.app/">
<meta property="og:image" content="https://get-lineup.app/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="LineUp">
<meta name="twitter:description" content="Know Before You Go.">
<meta name="twitter:image" content="https://get-lineup.app/icons/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="canonical" href="https://get-lineup.app/">
<link rel="icon" href="/icons/favicon-32.png?v=73" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=73" sizes="180x180">
<link rel="preload" href="/fonts/GeneralSans-Bold.woff2" as="font" type="font/woff2" crossorigin>
<title>LineUp</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<div id="splash" class="splash-screen">
  <div class="splash-content">
    <div class="splash-logo-wrap">
      <span class="lineup-wordmark splash-wordmark">LineUp</span>
    </div>
    <div class="splash-tagline">Know Before You Go</div>
  </div>
</div>
<div id="app">
  <header class="topbar">
    <div class="app-header">
      <div class="brand-block">
        <span class="lineup-wordmark">LineUp</span>
        <div class="app-subtitle"><span>Know Before You Go</span></div>
      </div>
      <button class="notify" id="liveAlertButton" aria-label="Live alerts" onclick="showToast('Live alerts are on')"><svg class="heartbeat live-motion" viewBox="0 0 32 24" aria-hidden="true"><path class="trace" d="M2 13h6l3-8 5 16 4-10 3 2h7"/></svg></button>
    </div>
    <div class="seg"><button id="tabU" class="on">University</button><button id="tabP">Downtown</button></div>
  </header>
  <main id="livePage" class="page active"></main>
  <main id="mapPage" class="page"></main>
  <main id="highlightsPage" class="page"></main>
  <main id="statsPage" class="page"></main>
  <main id="profilePage" class="page"></main>
</div>
<nav class="bottomnav"><div class="navinner">
  <button class="navbtn on" data-page="livePage"><i><svg class="heartbeat" viewBox="0 0 32 24" aria-hidden="true"><path class="trace" d="M2 13h6l3-8 5 16 4-10 3 2h7"/></svg></i><b>Live</b></button>
  <button class="navbtn" data-page="mapPage"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 0 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg></i><b>Map</b></button>
  <button class="navbtn" data-page="highlightsPage" aria-label="Deals"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="8.5" r="1"/></svg></i><b>Deals</b></button>
  <button class="navbtn" data-page="profilePage"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 4.2-6 8-6s6.4 2 8 6"/></svg></i><b>Profile</b></button>
</div></nav>
<section id="detail" class="detail"></section>
<div id="reportSheet" class="sheet"><div class="sheetcard" id="sheetcard"></div></div>
<div id="toast" style="position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#0B1220;color:#FFFFFF;border:1px solid rgba(15,23,42,.12);box-shadow:0 12px 30px rgba(15,23,42,.18);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:850;opacity:0;transition:.25s;z-index:220;pointer-events:none"></div>
<!-- Add-to-Home-Screen / PWA install prompt removed: LineUp is the product reference for a native Swift rebuild, not a PWA install funnel. Hidden stub retained only so existing #installPrompt references stay null-safe. -->
<section id="installPrompt" class="install-backdrop" hidden aria-hidden="true"></section>
<script type="module" src="./src/main.js"></script>
</body>
</html>
