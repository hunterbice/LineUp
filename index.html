<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#AB0520">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#AB0520">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080807">
<meta name="description" content="LineUp helps University of Arizona students check the line, crowd, and vibe before they go out.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LineUp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>LineUp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

/* LIGHT THEME */
:root{
  --red:#AB0520; --red-soft:#D3344E;
  --ink:#191918; --muted:#716f69; --hint:#a19e96;
  --bg:#f7f5ef; --bg2:#ebe8df; --card:#ffffff;
  --line:rgba(0,0,0,0.08); --line2:rgba(0,0,0,0.16);
  --tile:#f0eee7;
  --logo-invert:0;
  --q:#E7E3DA; --q-ink:#80786b;
  --e:#D9AD65; --e-ink:#4b3514;
  --b:#D9782E; --b-ink:#ffffff;
  --z:#EA4C35; --z-ink:#ffffff;
  --rampgrad:linear-gradient(to right,#E7E3DA,#D9AD65,#D9782E,#EA4C35);
  --headerbg:rgba(247,245,239,0.92);
  --toast-bg:#1c1c1a; --toast-ink:#fff;
  --shadow:0 12px 32px rgba(0,0,0,0.08);
}
/* DARK THEME */
html[data-theme="dark"]{
  --red:#FF3B5C; --red-soft:#FF6A7C;
  --ink:#f6f2ea; --muted:#a49f94; --hint:#6f6a60;
  --bg:#080807; --bg2:#11100e; --card:#181714;
  --line:rgba(255,255,255,0.075); --line2:rgba(255,255,255,0.13);
  --tile:#211f1b;
  --logo-invert:1;
  --q:#2b2925; --q-ink:#a09a8d;
  --e:#8D6427; --e-ink:#f6dab0;
  --b:#D57326; --b-ink:#fff;
  --z:#FF5138; --z-ink:#fff;
  --rampgrad:linear-gradient(to right,#2b2925,#8D6427,#D57326,#FF5138);
  --headerbg:rgba(8,8,7,0.88);
  --toast-bg:#f3f1ec; --toast-ink:#0e0d0c;
  --shadow:0 16px 42px rgba(0,0,0,0.38);
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .25s,color .25s;
  overscroll-behavior-y:none;
}
#app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(40px + env(safe-area-inset-bottom));}

header{
  position:sticky;top:0;z-index:50;
  background:var(--headerbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:calc(15px + env(safe-area-inset-top)) 18px 12px;border-bottom:0.5px solid var(--line);
}
.brandrow{display:flex;align-items:center;gap:10px;}
.mark{width:31px;height:31px;border-radius:9px;background:var(--red);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;box-shadow:0 8px 20px rgba(255,59,92,0.22);}
.brand{font-size:22px;font-weight:800;letter-spacing:0;}
.themebtn{margin-left:auto;width:44px;height:44px;border-radius:99px;
  border:0.5px solid var(--line);background:var(--bg2);cursor:pointer;
  font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.livedot{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px;font-weight:700;margin-left:8px;letter-spacing:0.2px;}
.livedot i{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.sub{font-size:12.5px;color:var(--muted);margin:3px 0 13px;font-weight:500;}

.tabs{display:flex;background:var(--bg2);border:0.5px solid var(--line);border-radius:13px;padding:4px;gap:4px;}
.tab{flex:1;min-height:36px;padding:9px 8px;background:none;border:none;border-radius:10px;
  font-size:13px;color:var(--muted);font-weight:800;cursor:pointer;font-family:inherit;}
.tab.on{color:var(--ink);background:var(--card);box-shadow:0 1px 8px rgba(0,0,0,0.12);}

.legend{display:none;align-items:center;gap:8px;padding:12px 18px 4px;
  font-size:10.5px;color:var(--hint);font-weight:600;letter-spacing:0.3px;}
.legend .ramp{flex:1;height:6px;border-radius:99px;background:var(--rampgrad);}

#list{padding:16px 14px 0;}
.card{background:var(--card);border:0.5px solid var(--line);border-radius:13px;
  padding:16px;margin-bottom:14px;cursor:pointer;transition:transform .08s, border-color .15s, background .15s;box-shadow:var(--shadow);}
.card:active{transform:scale(0.985);}
.crow{display:flex;align-items:flex-start;gap:13px;}
.tile{width:54px;height:54px;border-radius:11px;background:var(--tile);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.tile img{max-width:80%;max-height:80%;object-fit:contain;
  filter:saturate(0) brightness(0) invert(var(--logo-invert));}
.tile .ic{font-size:21px;}
.cname{font-size:17px;font-weight:800;letter-spacing:0;line-height:1.1;}
.nameclose{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;}
.closebadge{font-size:12px;font-weight:750;letter-spacing:0;color:var(--muted);white-space:nowrap;}
.closebadge.soon{color:var(--z);}
.closebadge.closed{color:var(--hint);}
.dclose{font-size:12px;font-weight:750;color:var(--muted);margin-top:4px;letter-spacing:0;}
.dclose.soon{color:var(--z);}
.dclose.closed{color:var(--hint);}
.ctag{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.25;}
.pill{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:99px;letter-spacing:0.4px;white-space:nowrap;}
.meter{height:5px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:14px 0 13px;}
.meter > div{height:100%;border-radius:99px;transition:width .4s;}
.cstats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;font-size:12.5px;color:var(--muted);font-weight:650;align-items:end;}
.cstats b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px;line-height:1.05;}
.cstats small{display:block;font-size:12px;color:var(--muted);font-weight:650;line-height:1.15;}
.cstats span{min-width:0;}
.cstats .subtle{color:var(--hint);font-weight:650;}
.cstats .gap{text-align:right;color:var(--hint);font-weight:650;}

#detail{padding:14px 18px 0;display:none;}
.back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--red);
  font-weight:600;background:none;border:none;cursor:pointer;font-family:inherit;margin-bottom:14px;padding:0;}
.dhead{display:flex;align-items:center;gap:13px;margin-bottom:16px;}
.dname{font-size:21px;font-weight:700;letter-spacing:-0.3px;}
.dtag{font-size:12.5px;color:var(--muted);margin-top:2px;}
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px;}
.stat{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.12);}
.stat .lab{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
.stat .val{font-size:21px;font-weight:700;margin-top:3px;}
.stat .val small{font-size:11px;font-weight:600;}
.stat .val.fr{font-size:13px;padding-top:5px;}
.stat .note{font-size:10.5px;color:var(--hint);font-weight:650;margin-top:2px;}
.sec{font-size:13px;font-weight:700;margin-bottom:9px;letter-spacing:-0.1px;}
.photos{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px;padding-bottom:2px;}
.photos .ph{min-width:92px;height:92px;border-radius:11px;background:var(--card);
  border:0.5px solid var(--line);display:flex;align-items:center;justify-content:center;}
.photos .ph i{font-size:22px;color:var(--hint);}
.photos .add{min-width:92px;height:92px;border-radius:11px;border:1.5px dashed var(--line2);
  background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.photos .add i{font-size:18px;}

.report{background:var(--card);border:0.5px solid var(--line);border-radius:13px;
  padding:15px;margin-bottom:20px;}
.lvlpick{display:flex;gap:6px;margin-bottom:10px;}
.lvlpick button{flex:1;padding:9px 0;border-radius:9px;border:0.5px solid var(--line2);
  background:var(--bg2);font-size:10px;font-weight:700;letter-spacing:0.3px;cursor:pointer;
  font-family:inherit;color:var(--muted);transition:all .12s;}
.lvlpick button.sel{transform:scale(1.03);}
input,textarea{width:100%;font-family:inherit;font-size:14px;border:0.5px solid var(--line2);
  border-radius:9px;background:var(--bg2);padding:10px;margin-bottom:9px;color:var(--ink);}
textarea{resize:none;height:56px;}
input:focus,textarea:focus{outline:none;border-color:var(--red);}
input::placeholder,textarea::placeholder{color:var(--hint);}
.post{width:100%;padding:12px;border:none;border-radius:10px;background:var(--red);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.post:active{opacity:0.85;}

.cmt{border-top:0.5px solid var(--line);padding:11px 0;}
.cmt:first-child{border-top:none;}
.cmthead{display:flex;justify-content:space-between;align-items:baseline;}
.cmtname{font-size:13px;font-weight:700;}
.cmttime{font-size:11px;color:var(--hint);}
.cmttext{font-size:14px;margin-top:3px;line-height:1.45;}
.empty{font-size:13px;color:var(--hint);padding:14px 0;text-align:center;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--toast-bg);color:var(--toast-ink);font-size:13px;font-weight:600;padding:10px 18px;
  border-radius:99px;opacity:0;transition:all .25s;z-index:99;pointer-events:none;}
.toast{bottom:calc(24px + env(safe-area-inset-bottom));}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.favbtn{width:44px;height:44px;border-radius:99px;border:0.5px solid var(--line);background:var(--bg2);color:var(--hint);font-size:17px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.favbtn.on{background:rgba(171,5,32,0.12);color:var(--red);border-color:rgba(171,5,32,0.28);}
html[data-theme="dark"] .favbtn.on{background:rgba(255,59,92,0.15);border-color:rgba(255,59,92,0.32);}
.actionrow{display:grid;grid-template-columns:1fr;gap:8px;margin:18px 0 6px;}
.jumpbtn,.ghostbtn{border:none;border-radius:11px;padding:12px 10px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;}
.jumpbtn{background:var(--red);color:#fff;box-shadow:0 10px 26px rgba(255,59,92,0.22);}
.ghostbtn{background:var(--card);color:var(--ink);border:0.5px solid var(--line);}
.partnerbox{border-top:0.5px solid var(--line);margin-top:18px;padding-top:16px;padding-bottom:20px;}
.partnerlabel{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--hint);margin-bottom:8px;}
.partnercopy{font-size:13px;line-height:1.4;color:var(--muted);margin-bottom:10px;}
.partnerbox .jumpbtn{background:var(--bg2);color:var(--ink);border:0.5px solid var(--line);box-shadow:none;}
.detailtabs{display:flex;background:var(--bg2);border:0.5px solid var(--line);border-radius:12px;padding:4px;margin-bottom:15px;gap:4px;}
.detailtabs button{flex:1;border:none;background:transparent;border-radius:9px;padding:8px 0;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;}
.detailtabs button.on{background:var(--card);color:var(--red);box-shadow:0 1px 5px rgba(0,0,0,0.06);}
.resetnote{font-size:11.5px;color:var(--hint);font-weight:600;margin:-8px 0 14px;line-height:1.35;}
.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px;}
.photoPanel{border:0.5px solid var(--line);background:var(--card);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.photoToggle{width:100%;border:none;background:transparent;color:var(--ink);font-family:inherit;padding:13px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-align:left;}
.photoTitle{font-size:13px;font-weight:800;}
.photoMeta{font-size:12px;color:var(--hint);font-weight:700;white-space:nowrap;}
.photoPanel summary{list-style:none;}
.photoPanel summary::-webkit-details-marker{display:none;}
.photoPanel[open] .photoMeta::after{content:" · Hide";}
.photoPanel:not([open]) .photoMeta::after{content:" · View";}
.photoBody{padding:0 12px 12px;}
.photoBody .photoGrid{margin-bottom:12px;}
.photoTile{aspect-ratio:1/1;border-radius:12px;border:0.5px solid var(--line);background:var(--card);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:11px;font-weight:700;text-align:center;padding:8px;}
.photoTile img{width:100%;height:100%;object-fit:cover;display:block;}
.photoTile .caption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:white;font-size:10.5px;font-weight:700;padding:18px 7px 6px;text-align:left;}
.filehide{display:none;}
.statline{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.statline b{font-size:13.5px;}.statline span{font-size:12.5px;color:var(--muted);text-align:right;}

</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brandrow">
      <div class="mark">&#9650;</div>
      <div class="brand">LineUp</div>
      <button class="themebtn" id="themebtn" aria-label="toggle theme">&#9790;</button>
      <div class="livedot"><i></i>LIVE</div>
    </div>
    <div class="sub">Tucson Nightlife &middot; Live Venue Status</div>
    <div class="tabs">
      <button class="tab on" id="tU">Main Gate</button>
      <button class="tab" id="tP">4th / Downtown</button>
    </div>
  </header>
  <div class="legend" id="legend">
    <span>Dead</span><span class="ramp"></span><span>Packed</span>
  </div>
  <div id="list"></div>
  <div id="detail"></div>
</div>
<div class="toast" id="toast"></div>

function load(){try{var st=localStorage.getItem("lineup_state_v1");if(st)return JSON.parse(st);var old=localStorage.getItem("lineup_state");if(old)return JSON.parse(old);}catch(e){}

function loadFavorites(){try{return JSON.parse(localStorage.getItem("lineup_favorites")||"[]");}catch(e){return [];}}
function saveFavorites(){try{localStorage.setItem("lineup_favorites",JSON.stringify(FAVORITES));}catch(e){}}
function isFav(id){return FAVORITES.indexOf(id)>-1;}
function toggleFav(id){var i=FAVORITES.indexOf(id);if(i>-1){FAVORITES.splice(i,1);toast("Removed from favorites");}else{FAVORITES.unshift(id);toast("Added to favorites");}saveFavorites(); if(curBar){renderDetail();}else{renderList();}}
function todayKey(){var n=tucsonNow();return n.getFullYear()+"-"+(n.getMonth()+1)+"-"+n.getDate();}
function ensureV1Data(){BARS.forEach(function(b){if(!STATE[b.id]) STATE[b.id]=JSON.parse(JSON.stringify(SEED[b.id]||{lvl:"dead",heads:0,wait:0,fresh:120,cmts:[]}));if(!STATE[b.id].highlights) STATE[b.id].highlights=[];if(!STATE[b.id].livePhotos) STATE[b.id].livePhotos=[];if(!STATE[b.id].insidePhotos) STATE[b.id].insidePhotos=[];if(!STATE[b.id].resetKey) STATE[b.id].resetKey="";});}
function resetClosedBars(){var key=todayKey();BARS.forEach(function(b){var info=closingInfo(b), st=STATE[b.id];if(!info.open && st.resetKey!==key){st.lvl="dead";st.heads=0;st.wait=0;st.fresh=120;st.cmts=[];st.livePhotos=[];st.insidePhotos=[];st.resetKey=key;}});save();}

/* theme */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  document.getElementById("themebtn").innerHTML = t==="dark" ? "&#9728;" : "&#9790;";
  try{localStorage.setItem("lineup_theme",t);}catch(e){}
}

var curTab="U",curBar=null;
function $(id){return document.getElementById(id);}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});}
function freshTxt(m){return m<60?m+" min ago":"1 hr+ ago";}
function insideRead(n){
  n=Math.max(0,Number(n)||0);
  if(n<=0)return "Quiet";
  if(n<80)return String(Math.round(n/5)*5);
  if(n<250)return String(Math.round(n/10)*10);
  if(n<500)return String(Math.round(n/25)*25);
  return Math.round(n/50)*50+"+";
}
function tucsonNow(){
  try{return new Date(new Date().toLocaleString("en-US",{timeZone:"America/Phoenix"}));}
  catch(e){return new Date();}
}
function hourLabel(h){
  var hr=h%24, suffix=hr>=12?"PM":"AM", n=hr%12||12;
  return n+" "+suffix;
}
function closingInfo(b){
  var now=tucsonNow();
  var y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  var open=b.open==null?20:b.open, close=b.close==null?2:b.close;
  var mins=now.getHours()*60+now.getMinutes();
  var openM=open*60, closeM=close*60;
  var isOvernight=closeM<=openM;
  var openNow=isOvernight ? (mins>=openM || mins<closeM) : (mins>=openM && mins<closeM);
  if(openNow){
    var closeDate=new Date(y,m,d,close,0,0,0);
    if(isOvernight && mins>=openM) closeDate.setDate(closeDate.getDate()+1);
    var diff=Math.max(0,Math.round((closeDate-now)/60000));
    var hrs=Math.floor(diff/60), mm=diff%60;
    var txt=diff<=45?"Closing soon · "+mm+"m left":(diff<=120?(hrs>0?"Closes in "+hrs+"h "+mm+"m":"Closes in "+mm+"m"):"Closes at "+hourLabel(close));
    return {open:true,soon:diff<=45,text:txt,detail:"Closes at "+hourLabel(close)};
  }
  return {open:false,soon:false,text:"Closed · Opens "+hourLabel(open),detail:"Opens at "+hourLabel(open)};
}

function tileHTML(b,sz,r){
  var st='width:'+sz+'px;height:'+sz+'px;border-radius:'+r+'px;';
  var src=b.logo&&(ASSET_LOGOS[b.logo]||LOGOS[b.logo]);
  if(src)
    return '<div class="tile" style="'+st+'"><img src="'+src+'" alt=""></div>';
  return '<div class="tile" style="'+st+'"><span class="ic">'+b.icon+'</span></div>';
}
function pill(lvl){var l=LV[lvl];
  return '<span class="pill" style="background:'+l.bg+';color:'+l.ink+'">'+l.t+'</span>';}

function renderList(){
  resetClosedBars();
  $("detail").style.display="none";
  $("list").style.display="block";
  $("legend").style.display="none";
  document.querySelector("header .tabs").style.display="flex";
  $("tU").className="tab"+(curTab==="U"?" on":"");
  $("tP").className="tab"+(curTab==="P"?" on":"");
  var list=BARS.filter(function(b){return b.tab===curTab;});
  list.sort(function(a,b){return (isFav(b.id)-isFav(a.id)) || a.name.localeCompare(b.name);});
  var h="";
  list.forEach(function(b){
    var st=STATE[b.id],l=LV[st.lvl],ci=closingInfo(b);
    h+='<div class="card" data-id="'+b.id+'">'+
      '<div class="crow">'+tileHTML(b,54,12)+
        '<div style="flex:1;min-width:0;">'+
          '<div class="nameclose"><span class="cname">'+esc(b.name)+'</span><span class="closebadge '+(ci.open?(ci.soon?"soon":""):"closed")+'">'+esc(ci.text)+'</span></div>'+
          '<div class="ctag">'+esc(b.tag)+'</div>'+ 
        '</div>'+ 
        '<button class="favbtn '+(isFav(b.id)?"on":"")+'" data-fav="'+b.id+'" aria-label="favorite">'+(isFav(b.id)?"★":"☆")+'</button></div>'+ 
      '<div class="meter"><div style="width:'+l.pct+'%;background:'+l.fill+'"></div></div>'+ 
      '<div class="cstats">'+
        '<span><b>'+LV[st.lvl].t+'</b><small>Crowd</small></span>'+ 
        '<span><b>'+(st.wait>0?st.wait+" Min":"No Line")+'</b><small>Line</small></span>'+ 
        '<span><b>'+insideRead(st.heads)+'</b><small>On-site now</small></span>'+ 
        '<span class="gap">Updated '+freshTxt(st.fresh)+'</span>'+ 
      '</div></div>';
  });
  $("list").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll(".favbtn"),function(btn){btn.onclick=function(e){e.stopPropagation();toggleFav(btn.getAttribute("data-fav"));};});
  Array.prototype.forEach.call(document.querySelectorAll(".card"),function(c){c.onclick=function(){curBar=c.getAttribute("data-id");DETAIL_TAB="live";renderDetail();window.scrollTo(0,0);};});
}

function lineLeapUrl(b){return b.lineLeap||("https://tickets.lineleap.com/search?search="+encodeURIComponent(b.name+" Tucson"));}
function renderPhotoTiles(arr,emptyText){if(!arr||!arr.length)return '<div class="photoTile" style="grid-column:1/-1;min-height:105px;">'+emptyText+'</div>';return arr.map(function(p){return '<div class="photoTile"><img src="'+esc(p.src)+'" alt=""><div class="caption">'+esc(p.caption||'LineUp Photo')+'</div></div>';}).join('');}
function photoPanelHTML(title,arr,emptyText,inputId,buttonId,buttonText){
  var count=(arr&&arr.length)||0;
  return '<details class="photoPanel"><summary class="photoToggle"><span class="photoTitle">'+esc(title)+'</span><span class="photoMeta">'+count+' Photo'+(count===1?'':'s')+'</span></summary>'+
    '<div class="photoBody"><div class="photoGrid">'+renderPhotoTiles(arr,emptyText)+'</div>'+
    '<input class="filehide" type="file" accept="image/*" id="'+inputId+'"><button class="ghostbtn" id="'+buttonId+'" style="width:100%;">'+esc(buttonText)+'</button></div></details>';
}
function detailTabsHTML(){if(DETAIL_TAB==="stats")DETAIL_TAB="live";return '<div class="detailtabs"><button data-tab="live" class="'+(DETAIL_TAB==="live"?"on":"")+'">Tonight</button><button data-tab="highlights" class="'+(DETAIL_TAB==="highlights"?"on":"")+'">Highlights</button></div>';}
function partnerJumpHTML(b){return '<div class="partnerbox"><div class="partnerlabel">Need to skip the line?</div><div class="partnercopy">Check LineLeap after reviewing live reports, photos, and comments in LineUp.</div><div class="actionrow"><a class="jumpbtn" href="'+lineLeapUrl(b)+'" target="_blank" rel="noopener">Open LineLeap Jump</a></div></div>';}

function renderDetail(){
  resetClosedBars();
  $("list").style.display="none";
  $("legend").style.display="none";
  document.querySelector("header .tabs").style.display="none";
  var d=$("detail");d.style.display="block";
  var b=BARS.filter(function(x){return x.id===curBar;})[0];
  var st=STATE[b.id],ci=closingInfo(b);
  var header='<button class="back" id="back">&larr; All Bars</button>'+ 
    '<div class="dhead">'+tileHTML(b,58,13)+
      '<div style="flex:1;min-width:0;">'+
        '<div class="dname">'+esc(b.name)+'</div><div class="dclose '+(ci.open?(ci.soon?"soon":""):"closed")+'">'+esc(ci.text)+'</div><div class="dtag">'+esc(b.tag)+' · '+esc(ci.detail)+'</div>'+ 
      '</div><button class="favbtn '+(isFav(b.id)?"on":"")+'" id="detailFav">'+(isFav(b.id)?"★":"☆")+'</button>'+pill(st.lvl)+'</div>'+ 
    detailTabsHTML();
  var body="";
  if(DETAIL_TAB==="live"){
    var ch="";st.cmts.forEach(function(c){ch+='<div class="cmt"><div class="cmthead"><span class="cmtname">'+esc(c.n)+'</span><span class="cmttime">'+esc(freshTxt(c.a))+'</span></div><div class="cmttext">'+esc(c.t)+'</div></div>';});
    if(!st.cmts.length)ch='<div class="empty">No live comments yet &mdash; resets after close.</div>';
    body='<div class="resetnote">Live crowd reports, line photos, and comments clear after this bar closes. Highlights stay saved.</div>'+ 
    '<div class="stats3">'+
      '<div class="stat"><div class="lab">On-site now</div><div class="val">'+insideRead(st.heads)+'</div><div class="note">LineUp read</div></div>'+ 
      '<div class="stat"><div class="lab">Line</div><div class="val">'+st.wait+'<small> min</small></div></div>'+ 
      '<div class="stat"><div class="lab">Freshness</div><div class="val fr">'+freshTxt(st.fresh)+'</div></div>'+ 
    '</div>'+ 
    '<div class="sec">Photos</div>'+ 
    photoPanelHTML('Line Photos',st.livePhotos,'No line photos yet.<br>Upload one from outside the venue.','linePhotoInput','addLinePhoto','Add Line Photo')+
    photoPanelHTML('Venue Photos',st.insidePhotos,'No venue photos yet.<br>Upload one from the floor, patio, or deck.','insidePhotoInput','addInsidePhoto','Add Venue Photo')+
    '<div class="sec">Submit Live Report</div>'+ 
    '<div class="report"><div class="lvlpick" id="lvlpick">'+ORDER.map(function(k){return '<button data-l="'+k+'">'+LV[k].t+'</button>';}).join("")+'</div>'+ 
      '<input id="rname" placeholder="Name" maxlength="20"><textarea id="rcmt" placeholder="Line length, cover, notes..." maxlength="140"></textarea><button class="post" id="post">Post Report</button></div>'+ 
    '<div class="sec">Comments &middot; '+st.cmts.length+'</div><div>'+ch+'</div>'+partnerJumpHTML(b);
  } else if(DETAIL_TAB==="highlights"){
    body='<div class="resetnote">Highlights are persistent memories from the night. They do not clear with live stats.</div>'+ 
      '<div class="photoGrid">'+renderPhotoTiles(st.highlights,'No highlights yet.<br>Add the first photo for this bar.')+'</div>'+ 
      '<input class="filehide" type="file" accept="image/*" id="highlightInput"><button class="jumpbtn" id="addHighlight" style="width:100%;margin-bottom:12px;">Add Highlight Photo</button>'+ 
      '<div class="resetnote">Prototype quality rule: photos under 720px wide or tall are rejected as too low quality.</div>'+partnerJumpHTML(b);
  }
  d.innerHTML=header+body;
  $("back").onclick=function(){curBar=null;renderList();window.scrollTo(0,0);};
  $("detailFav").onclick=function(){toggleFav(b.id);};
  Array.prototype.forEach.call(document.querySelectorAll(".detailtabs button"),function(btn){btn.onclick=function(){DETAIL_TAB=btn.getAttribute("data-tab");renderDetail();};});
  if(DETAIL_TAB==="live") bindLiveForm(st);
  if(DETAIL_TAB==="highlights") bindHighlightForm(st);
}

function bindLiveForm(st){
  var pick=null;
  Array.prototype.forEach.call(document.querySelectorAll("#lvlpick button"),function(btn){btn.onclick=function(){pick=btn.getAttribute("data-l");Array.prototype.forEach.call(document.querySelectorAll("#lvlpick button"),function(x){x.className="";x.style.background="var(--bg2)";x.style.color="var(--muted)";});btn.className="sel";btn.style.background=LV[pick].bg;btn.style.color=LV[pick].ink;};});
  $("post").onclick=function(){var nm=$("rname").value.trim()||"Anonymous";var tx=$("rcmt").value.trim();if(!pick&&!tx){toast("Select a crowd level or add a comment");return;}if(pick){st.lvl=pick;st.heads=Math.round(LV[pick].pct*7+(Math.random()*40-20));st.wait=pick==="packed"?20+Math.round(Math.random()*20):pick==="busy"?5+Math.round(Math.random()*15):0;}st.fresh=1;if(tx)st.cmts.unshift({n:nm,t:tx,a:1});save();renderDetail();window.scrollTo(0,0);toast("Report posted");};
  $("addLinePhoto").onclick=function(){$("linePhotoInput").click();};
  $("linePhotoInput").onchange=function(e){handlePhoto(e,st.livePhotos,"Line photo added");};
  $("addInsidePhoto").onclick=function(){$("insidePhotoInput").click();};
  $("insidePhotoInput").onchange=function(e){handlePhoto(e,st.insidePhotos,"Venue photo added");};
}
function bindHighlightForm(st){$("addHighlight").onclick=function(){$("highlightInput").click();};$("highlightInput").onchange=function(e){handlePhoto(e,st.highlights,"Highlight saved");};}
function handlePhoto(e,target,msg){var file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.match(/^image\//)){toast("Upload an image file");return;}var reader=new FileReader();reader.onload=function(ev){var img=new Image();img.onload=function(){if(Math.min(img.width,img.height)<720){toast("Photo too low quality — 720px minimum");return;}target.unshift({src:ev.target.result,caption:"Uploaded tonight"});if(target.length>12)target.pop();save();renderDetail();toast(msg);};img.src=ev.target.result;};reader.readAsDataURL(file);}

var toastTimer;
function toast(msg){
  var t=$("toast");t.textContent=msg;t.className="toast show";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.className="toast";},2200);
}

$("themebtn").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  applyTheme(cur==="dark"?"light":"dark");
};
$("tU").onclick=function(){curTab="U";renderList();};
$("tP").onclick=function(){curTab="P";renderList();};
renderList();
setInterval(function(){ if(curBar){renderDetail();} else {renderList();} },60000);

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
