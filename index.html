<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: restore the real path that
      // public/404.html encoded into the query string before redirecting here.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <title>LineUp — Know Before You Go</title>
    <meta
      name="description"
      content="See live crowd levels, line lengths, wait times, and deals at Tucson's busiest bars before you leave home. LineUp is real-time nightlife intelligence for University of Arizona students."
    />
    <meta name="author" content="LineUp" />
    <meta property="og:site_name" content="LineUp" />
    <meta property="og:title" content="LineUp — Know Before You Go" />
    <meta
      property="og:description"
      content="Real-time nightlife intelligence for Tucson. See crowd levels, line lengths, wait times, and deals before you go."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
    />
  </head>

  </body>
</html>
