<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<meta name="color-scheme" content="dark">
<title>LineUp Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:#07080B;color:#F4F6FA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;}
main{width:min(100%,420px);}
.wordmark{width:150px;height:auto;display:block;margin-bottom:18px;}
h1{font-size:26px;line-height:1.1;margin-bottom:10px;}
p{color:#B8BDC8;font-size:15px;line-height:1.45;margin-bottom:18px;}
a{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#145CFF;color:#fff;text-decoration:none;font-weight:800;padding:12px 16px;}
</style>
</head>
<body>
<main>
  <img class="wordmark" src="assets/LineUp_Header_Wordmark_2x.png" alt="LineUp">
  <h1>LineUp is offline</h1>
  <p>The app is saved on this phone, but live nightlife data needs a connection. Reconnect and refresh to get the latest crowd reads.</p>
  <a href="./index.html">Try again</a>
</main>
</body>
</html>
