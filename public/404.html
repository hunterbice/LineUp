<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LineUp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      GitHub Pages has no server-side rewrites, so a direct load or refresh of
      any deep route (e.g. /privacy) 404s. GitHub Pages serves this file for
      any unknown path. It re-encodes the requested path into a query string
      and redirects to "/", where the inline script in index.html decodes it
      and restores the real path via history.replaceState before the app
      boots. Query strings and hashes survive the round trip.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 0; // served from the domain root (custom domain)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
