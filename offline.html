<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<title>LineUp Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:#07080B;color:#F4F6FA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;}
main{width:min(100%,420px);}
.mark{width:42px;height:42px;border-radius:12px;background:#101116;border:1px solid rgba(18,224,196,.45);display:flex;align-items:center;justify-content:center;color:#12E0C4;font-size:23px;font-weight:900;margin-bottom:18px;box-shadow:0 0 24px rgba(18,224,196,.16);}
h1{font-size:26px;line-height:1.1;margin-bottom:10px;}
p{color:#B8BDC8;font-size:15px;line-height:1.45;margin-bottom:18px;}
a{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#12E0C4;color:#021311;text-decoration:none;font-weight:800;padding:12px 16px;}
</style>
</head>
<body>
<main>
  <div class="mark">L</div>
  <h1>LineUp is offline</h1>
  <p>The app shell is saved on this phone, but live nightlife data needs a connection.</p>
  <a href="./index.html">Try again</a>
</main>
</body>
</html>
